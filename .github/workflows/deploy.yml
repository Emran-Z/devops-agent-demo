name: Deploy to EC2 via SSM

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

env:
  AWS_REGION:      ${{ vars.AWS_REGION }}          # e.g. us-east-1
  DEPLOY_BUCKET:   ${{ vars.DEPLOY_BUCKET }}        # S3 bucket for staging artefacts
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}      # i-0abc123...
  APP_DIR:         /opt/devops-agent-demo-app

jobs:
  deploy:
    name: Deploy app
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Upload app to S3
        run: |
          aws s3 sync app/ \
            s3://${{ env.DEPLOY_BUCKET }}/devops-agent-demo/app/ \
            --delete \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"

      - name: Deploy via SSM send-command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devops-agent-demo $(git rev-parse --short HEAD)" \
            --parameters 'commands=[
              "#!/bin/bash",
              "set -euo pipefail",
              "export PATH=/usr/local/bin:/usr/bin:/bin:$PATH",
              "APP_DIR=${{ env.APP_DIR }}",
              "BUCKET=${{ env.DEPLOY_BUCKET }}",

              "# Pull latest code from S3",
              "rm -rf ${APP_DIR}/venv",
              "aws s3 sync s3://${BUCKET}/devops-agent-demo/app/ ${APP_DIR}/",

              "# Recreate venv to avoid stale symlinks",
              "python3 -m venv ${APP_DIR}/venv",
              "${APP_DIR}/venv/bin/pip install -q --upgrade pip",
              "${APP_DIR}/venv/bin/pip install -q -r ${APP_DIR}/requirements.txt",

              "# Fix ownership",
              "chown -R ubuntu:ubuntu ${APP_DIR}",

              "# Restart the service",
              "systemctl restart devops-agent-demo",
              "systemctl is-active --quiet devops-agent-demo && echo \"Service is running\" || (journalctl -u devops-agent-demo -n 30 && exit 1)"
            ]' \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          echo "Waiting for SSM command ${COMMAND_ID} ..."

          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "  attempt ${i}/24 — status: ${STATUS}"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable)
                echo "Deployment failed with status: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command."
          exit 1

